<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500;600&display=swap">
  <style>
    body { margin: 0; background: #0A0B0D; font-family: Geist, system-ui, sans-serif; }
    a { color: #5B8DEF; } a:hover { color: #82A8F4; }
    .mono { font-family: "Geist Mono", ui-monospace, monospace; font-feature-settings: "tnum"; }
    @keyframes dd-sweep { 0% { stroke-dashoffset: 620; } 100% { stroke-dashoffset: 0; } }
    @keyframes dd-pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.35; } }
    @keyframes dd-indeterminate { 0% { transform: translateX(-100%); } 100% { transform: translateX(360%); } }
  </style>
</helmet>

<div style="width: 390px; height: 844px; background: #0A0B0D; color: #F2F4F7; display: flex; flex-direction: column; overflow: hidden">

  <div style="display: flex; align-items: center; gap: 12px; padding: 10px 16px 12px 16px">
    <div style="width: 40px; height: 40px; border-radius: 50%; background: #14161A; display: flex; align-items: center; justify-content: center; flex-shrink: 0">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#F2F4F7" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5"></path><path d="m12 19-7-7 7-7"></path></svg>
    </div>
    <div style="flex-grow: 1; min-width: 0">
      <div style="font-size: 18px; font-weight: 600; letter-spacing: -0.3px; color: #F2F4F7">Home → Office</div>
      <div style="font-size: 14px; color: #8A9099; margin-top: 1px">Just now · Clio 4</div>
    </div>
    <div style="width: 40px; height: 40px; border-radius: 50%; background: #14161A; display: flex; align-items: center; justify-content: center; flex-shrink: 0">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="#F2F4F7"><circle cx="12" cy="5" r="1.8"></circle><circle cx="12" cy="12" r="1.8"></circle><circle cx="12" cy="19" r="1.8"></circle></svg>
    </div>
  </div>

  <!-- Only the trip-level stats exist yet; the vs-best delta needs segments, so it is withheld
       rather than shown as a zero. -->
  <div style="display: flex; gap: 8px; padding: 4px 20px 14px 20px">
    <div style="flex-grow: 1">
      <div class="mono" style="font-size: 24px; font-weight: 500; color: #F2F4F7">24:18</div>
      <div style="font-size: 14px; color: #8A9099">Duration</div>
    </div>
    <div style="flex-grow: 1">
      <div class="mono" style="font-size: 24px; font-weight: 500; color: #F2F4F7">31.2</div>
      <div style="font-size: 14px; color: #8A9099">km</div>
    </div>
    <div style="flex-grow: 1">
      <div class="mono" style="font-size: 24px; font-weight: 500; color: #F2F4F7">58</div>
      <div style="font-size: 14px; color: #8A9099">avg km/h</div>
    </div>
    <div style="flex-grow: 1">
      <div class="mono" style="font-size: 24px; font-weight: 500; color: #3A4048">—</div>
      <div style="font-size: 14px; color: #8A9099">vs best</div>
    </div>
  </div>

  <div style="display: flex; border-bottom: 1px solid rgba(255,255,255,0.07)">
    <div style="flex-grow: 1; text-align: center; padding: 14px 0 12px 0; font-size: 15px; font-weight: 500; color: #7E858F">Map</div>
    <div style="flex-grow: 1; text-align: center; padding: 14px 0 12px 0; font-size: 15px; font-weight: 500; color: #7E858F">Splits</div>
    <div style="flex-grow: 1; text-align: center; padding: 14px 0 10px 0; font-size: 15px; font-weight: 600; color: #F2F4F7; border-bottom: 2px solid #5B8DEF; margin-bottom: -1px">Segments</div>
    <div style="flex-grow: 1; text-align: center; padding: 14px 0 12px 0; font-size: 15px; font-weight: 500; color: #7E858F">Cost</div>
  </div>

  <!-- The raw trace is already on the device, so show it; only the segment split is pending. -->
  <div style="position: relative; flex-grow: 1; overflow: hidden">
    <svg width="390" height="100%" viewBox="0 0 390 330" preserveAspectRatio="xMidYMid slice" style="display: block">
      <rect x="0" y="0" width="390" height="330" fill="#0A0B0D"></rect>
      <g stroke="#15171B" stroke-width="1.5" fill="none">
        <path d="M0 84 H390 M0 176 H390 M0 262 H390 M74 0 V330 M186 0 V330 M296 0 V330"></path>
      </g>
      <g fill="#0E1014">
        <rect x="86" y="96" width="86" height="66" rx="3"></rect>
        <rect x="200" y="96" width="82" height="66" rx="3"></rect>
        <rect x="86" y="190" width="86" height="58" rx="3"></rect>
        <rect x="200" y="190" width="82" height="58" rx="3"></rect>
      </g>
      <polyline points="28,300 52,286 66,262 62,240 82,214 122,206 158,214 196,222 232,206 252,178 268,146 258,110 226,88 188,74 148,80 118,66 96,50 100,30 134,20 176,26 214,34 238,52"
                fill="none" stroke="#23262C" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"></polyline>
      <!-- a light sweeps the trace while the split is computed -->
      <polyline points="28,300 52,286 66,262 62,240 82,214 122,206 158,214 196,222 232,206 252,178 268,146 258,110 226,88 188,74 148,80 118,66 96,50 100,30 134,20 176,26 214,34 238,52"
                fill="none" stroke="#5B8DEF" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"
                stroke-dasharray="120 500" style="animation: dd-sweep 2.4s linear infinite"></polyline>
    </svg>
  </div>

  <div style="background: #101216; border-top: 1px solid rgba(255,255,255,0.08); border-radius: 28px 28px 0 0; padding: 22px 20px 24px 20px; box-shadow: 0 -14px 40px rgba(0,0,0,0.5)">
    <div style="display: flex; align-items: center; gap: 14px">
      <div style="width: 44px; height: 44px; border-radius: 10px; background: rgba(91,141,239,0.16); display: flex; align-items: center; justify-content: center; flex-shrink: 0; animation: dd-pulse 1.6s ease-in-out infinite">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#5B8DEF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19.5V6a2 2 0 0 1 2-2h1"></path><path d="m9 4 6 3 6-3v13l-6 3-6-3Z"></path><path d="M9 4v13"></path><path d="M15 7v13"></path></svg>
      </div>
      <div style="flex-grow: 1; min-width: 0">
        <div style="font-size: 15px; font-weight: 500; color: #F2F4F7">Processing ride…</div>
        <div style="font-size: 14px; color: #8A9099; margin-top: 2px; text-wrap: pretty">Matching your trace to the road network and splitting it into segments.</div>
      </div>
    </div>

    <!-- Indeterminate track: no percentage, because there isn't an honest one to show. -->
    <div style="margin-top: 18px; height: 5px; border-radius: 3px; background: rgba(255,255,255,0.12); overflow: hidden">
      <div style="width: 28%; height: 100%; border-radius: 3px; background: #5B8DEF; animation: dd-indeterminate 1.5s ease-in-out infinite"></div>
    </div>

    <div style="display: flex; align-items: center; gap: 12px; margin-top: 16px">
      <div style="width: 56px; height: 56px; border-radius: 16px; background: #101216; border: 1px solid rgba(255,255,255,0.08); display: flex; align-items: center; justify-content: center; flex-shrink: 0">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#3A4048" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"></path></svg>
      </div>
      <div style="flex-grow: 1; text-align: center">
        <div style="font-size: 11px; font-weight: 600; letter-spacing: 1.5px; color: #6B7178">NO SEGMENTS YET</div>
      </div>
      <div style="width: 56px; height: 56px; border-radius: 16px; background: #101216; border: 1px solid rgba(255,255,255,0.08); display: flex; align-items: center; justify-content: center; flex-shrink: 0">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#3A4048" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="m9 18 6-6-6-6"></path></svg>
      </div>
    </div>
  </div>
</div>
</x-dc>

<script data-dc-script data-props='{"$preview": {"width": 390, "height": 844}}'>
class Component extends DCLogic {}
</script>
</body>
</html>
